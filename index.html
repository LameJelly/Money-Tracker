<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b82f6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Money Tracker</title>
<style>
:root{--bg:#f2f7ff;--card:#fff;--ink:#16233b;--mute:#62759a;--line:#e1eaf8;--acc:#3b82f6;--acc2:#e6f0ff;--inc:#0fa57a;--exp:#f0455f;--warn:#f59e0b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:104px}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
h1{font-size:28px;margin:4px 0 16px;font-weight:750;letter-spacing:-.01em}
h2{font-size:15px;margin:24px 2px 10px;color:var(--mute);font-weight:650;text-transform:uppercase;letter-spacing:.06em}
.card{background:var(--card);border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 2px 14px rgba(50,90,170,.08)}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.hero{background:linear-gradient(135deg,#3b82f6,#6aa6ff);color:#fff;border-radius:26px;padding:22px;margin-bottom:14px;box-shadow:0 8px 24px rgba(59,130,246,.3)}
.hero small{color:rgba(255,255,255,.85);font-size:15px}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px;word-break:break-word}
.hero .big.neg{color:#ffe1e6}
.hero .two{display:flex;gap:10px}
.hero .two div{flex:1;background:rgba(255,255,255,.18);border-radius:16px;padding:10px 12px}
.hero .two b{display:block;font-size:18px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.sum div{background:var(--card);border-radius:18px;padding:12px;box-shadow:0 2px 14px rgba(50,90,170,.08)}
.sum small{display:block;color:var(--mute);font-size:14px}
.sum b{font-size:17px;word-break:break-word}
.inc{color:var(--inc)}.exp{color:var(--exp)}
input,select,textarea,button{font:inherit;color:inherit}
input,select{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-bottom:12px;font-size:18px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
input.amt{font-size:30px;font-weight:750;padding:16px}
.lb{display:block;font-size:15px;color:var(--mute);margin:0 2px 6px;font-weight:600}
button{padding:15px 18px;border:0;border-radius:14px;background:var(--acc);color:#fff;font-weight:650;cursor:pointer;font-size:18px}
button:active{transform:scale(.98)}
button.ghost{background:var(--acc2);color:var(--acc)}
button.small{padding:9px 14px;font-size:15px;border-radius:12px}
button.del{background:transparent;color:var(--exp);padding:8px 10px}
button.danger{background:var(--exp)}
button.full{width:100%}
.seg{display:flex;gap:6px;margin-bottom:14px;background:var(--acc2);padding:5px;border-radius:16px}
.seg button{flex:1;background:transparent;color:var(--mute);padding:11px 6px;font-size:16px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 6px rgba(50,90,170,.15)}
.seg button.on.e{color:var(--exp)}.seg button.on.i{color:var(--inc)}.seg button.on.l{color:var(--warn)}
.bar{height:12px;border-radius:8px;background:var(--acc2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px}
.bar i.over{background:var(--exp)}.bar i.near{background:var(--warn)}
.item{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item.tap{cursor:pointer}
.item small,small{color:var(--mute);font-size:14px}
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month b{font-size:20px}
.menu{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);color:var(--ink);padding:18px;border-radius:20px;margin-bottom:10px;box-shadow:0 2px 14px rgba(50,90,170,.08)}
.menu span.ic{font-size:26px}
.menu small{display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -4px 20px rgba(50,90,170,.12);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:4px;z-index:5}
nav button{flex:1;background:transparent;color:var(--mute);border-radius:16px;padding:8px 4px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:24px;line-height:1.1}
nav button.on{color:var(--acc);background:var(--acc2)}
.banner{background:#fff3d1;color:#6a4a00;border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:108px;background:#16233b;color:#fff;padding:12px 18px;border-radius:22px;font-size:16px;max-width:92%;display:flex;gap:12px;align-items:center;z-index:20}
.toast button{background:rgba(255,255,255,.2);color:#fff}
.empty{color:var(--mute);text-align:center;padding:18px 0}
.ov{position:fixed;inset:0;background:rgba(22,35,59,.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.dlg{background:#fff;border-radius:24px;padding:22px;width:100%;max-width:420px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:10px;padding:2px 8px;font-size:12px;font-weight:650;margin-left:6px;vertical-align:middle}
.tag.off{background:#eef0f4;color:var(--mute)}
label.chk{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:17px}
label.chk input{width:22px;height:22px;margin:0}
.lock{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.dots span{display:inline-block;width:16px;height:16px;border-radius:50%;border:2px solid var(--acc);margin:0 6px}
.dots span.f{background:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,78px);gap:14px}
.pad button{width:78px;height:78px;border-radius:50%;font-size:28px;padding:0;background:#fff;color:var(--ink);box-shadow:0 2px 12px rgba(50,90,170,.12)}
</style>
</head>

function parseCSV(text){
  const rows=[];let row=[],cur="",inq=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inq){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++;}else inq=false;}else cur+=c;}
    else if(c==='"'){if(cur==="")inq=true;else cur+=c;}
    else if(c===","){row.push(cur);cur="";}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(cur);cur="";if(row.some(x=>x!==""))rows.push(row);row=[];}
    else cur+=c;
  }
  row.push(cur);if(row.some(x=>x!==""))rows.push(row);
  return rows;
}

      h("p",{style:"color:var(--mute);margin:4px 0 12px;font-size:16px"},"A .json backup, a .csv (date, type, category, amount, note), or the CSV from your old money app."),
      h("button",{class:"full",onclick:()=>file.click()},"Choose file"),
      file,
      paste,
      h("button",{class:"ghost full",onclick:()=>{const t=paste.value.trim();if(!t){toast("Paste some text first");return;}confirmImport(t[0]==="{"?"paste.json":"paste.csv",t);}},"Import pasted text")),
    viewDrive(),
    h("div",{class:"card"},h("b",null,"Safety"),
      h("p",{style:"color:var(--mute);margin:4px 0 12px;font-size:16px"},"Before any import, plan load or reset, a restore point is saved automatically."),
      h("button",{class:"ghost full",onclick:()=>{
        const p=getPrev();if(!p){toast("No restore point yet");return;}
        ask({title:"Restore previous version?",body:"Your current data is replaced by the version from before the last big change.",ok:"Restore",onOk:()=>{try{const d=JSON.parse(p);S=Object.assign(emptyState(),d);save();toast("Restored");}catch(e){toast("Could not restore");}}});}},"Restore previous version"),
      h("button",{class:"full danger",style:"margin-top:10px",onclick:()=>ask({title:"Delete ALL data?",body:"Entries, budgets, goals, cicilan, trips and wallets are erased on every synced device. Export a backup first.",word:"DELETE",ok:"Delete everything",onOk:()=>{snapshotBefore();S=emptyState();ensureWallets();save();toast("All data deleted");}})},"Delete all data")));
}

/* ---------- PIN lock (screen lock, per device) ---------- */
const PINKEY="mt_pin";
let locked=false,hiddenAt=0,pinBuf="",pinFails=0,lockUntil=0,lockMsg="",lockTimer=null;
const pinOk=()=>!!(window.crypto&&crypto.subtle&&window.TextEncoder);
function getPin(){try{return JSON.parse(localStorage.getItem(PINKEY)||"null");}catch(e){return null;}}
async function hashStr(str,salt){
  const enc=new TextEncoder();
  const key=await crypto.subtle.importKey("raw",enc.encode(str),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:100000,hash:"SHA-256"},key,256);
  return Array.from(new Uint8Array(bits)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
const normCode=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function randCode(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r=new Uint8Array(10);crypto.getRandomValues(r);
  const c=Array.from(r).map(x=>A[x%A.length]).join("");return c.slice(0,5)+"-"+c.slice(5);
}
async function storePin(pin,keep){
  const salt=uid()+uid();let rec={salt,hash:await hashStr(pin,salt),len:pin.length},code=null;
  if(keep&&keep.rhash){rec.rsalt=keep.rsalt;rec.rhash=keep.rhash;}
  else{code=randCode();rec.rsalt=uid()+uid();rec.rhash=await hashStr(normCode(code),rec.rsalt);}
  localStorage.setItem(PINKEY,JSON.stringify(rec));return code;
}
async function checkPin(pin){const p=getPin();return !!p&&(await hashStr(pin,p.salt))===p.hash;}
async function checkCode(c){const p=getPin();return !!p&&!!p.rhash&&(await hashStr(normCode(c),p.rsalt))===p.rhash;}
function lockNow(){if(!getPin())return;locked=true;pinBuf="";lockMsg="";document.querySelectorAll(".ov,.toast").forEach(n=>n.remove());render();}
async function tryUnlock(){
  const ok=await checkPin(pinBuf);pinBuf="";
  if(ok){locked=false;pinFails=0;lockMsg="";render();window.scrollTo(0,0);return;}
  pinFails++;lockMsg="Wrong PIN";
  if(pinFails>=5)lockUntil=Date.now()+Math.min(600,30*Math.pow(2,pinFails-5))*1000;
  render();
}
function viewLock(){
  const p=getPin(),len=(p&&p.len)||4;
  const wait=Math.max(0,Math.ceil((lockUntil-Date.now())/1000));
  if(wait>0){clearTimeout(lockTimer);lockTimer=setTimeout(render,wait*1000);}
  const press=d=>{if(Date.now()<lockUntil||pinBuf.length>=len)return;lockMsg="";pinBuf+=d;if(pinBuf.length===len)tryUnlock();else render();};
  const key=d=>h("button",{onclick:()=>press(d)},d);
  const dots=[];for(let i=0;i<len;i++)dots.push(h("span",{class:i<pinBuf.length?"f":""}));
  return h("div",{class:"lock"},
    h("div",{style:"font-size:44px"},"🔒"),
    h("b",{style:"font-size:22px"},"Enter PIN"),
    h("div",{class:"dots"},dots),
    h("div",{style:"min-height:24px;color:var(--exp);text-align:center"},wait>0?T("Too many tries. Wait {0}s.",wait):lockMsg),
    h("div",{class:"pad"},["1","2","3","4","5","6","7","8","9"].map(key),h("span"),key("0"),
      h("button",{onclick:()=>{pinBuf=pinBuf.slice(0,-1);render();}},"⌫")),
    h("button",{class:"ghost small",onclick:()=>ask({title:"Reset with recovery code",body:"Enter the recovery code you saved when you set the PIN. Your data stays untouched.",field:{placeholder:"Recovery code"},ok:"Reset",danger:false,onOk:async v=>{
      if(!(await checkCode(v))){toast("Wrong recovery code");return false;}
      try{localStorage.removeItem(PINKEY);}catch(e){}
      locked=false;pinFails=0;lockMsg="";render();toast("PIN removed");}})},"Forgot PIN?"));
}
function showRecovery(code){
  if(!code)return;
  ask({title:"Save your recovery code",body:T("Write this code down somewhere safe. It is the only way to reset a forgotten PIN: {0}",code),ok:"OK, I saved it",danger:false,onOk:()=>true});
}
function viewSecurity(){
  const p=getPin();
  const pinField=ph=>h("input",{type:"password",inputmode:"numeric",maxlength:"6",placeholder:ph,autocomplete:"off"});
  const valid=x=>/^\d{4,6}$/.test(x);
  const note=h("p",{style:"color:var(--mute);font-size:15px;margin:12px 0 0"},"This is a screen lock: it keeps people who pick up your device out of the app. It does not encrypt your data, so keep your device lock and Google 2-step verification on.");
  if(!pinOk())return h("div",null,h("h1",null,"Security"),h("div",{class:"card"},h("div",{class:"empty"},"PIN lock is not available here")));
  if(!p){
    const a=pinField("New PIN (4-6 digits)"),b=pinField("Confirm PIN");
    return h("div",null,h("h1",null,"Security"),h("div",{class:"card"},
      h("b",null,"PIN lock is off"),h("div",{style:"height:12px"}),
      fld("New PIN (4-6 digits)",a),fld("Confirm PIN",b),
      h("button",{class:"full",onclick:async()=>{
        if(!valid(a.value)){toast("PIN must be 4-6 digits");return;}
        if(a.value!==b.value){toast("PINs do not match");return;}
        try{const code=await storePin(a.value);toast("PIN set");render();showRecovery(code);}catch(e){toast("PIN lock is not available here");}}},"Set PIN"),note));
  }
  const cur=pinField("Current PIN"),nw=pinField("New PIN (4-6 digits)");
  return h("div",null,h("h1",null,"Security"),
    h("div",{class:"card"},h("b",null,"PIN lock is on"),h("div",{style:"height:12px"}),
      h("button",{class:"full",onclick:lockNow},"Lock now"),note),
    h("div",{class:"card"},fld("Current PIN",cur),fld("New PIN (4-6 digits)",nw),
      h("button",{class:"ghost full",onclick:async()=>{
        if(!(await checkPin(cur.value))){toast("Wrong PIN");return;}
        if(!valid(nw.value)){toast("PIN must be 4-6 digits");return;}
        await storePin(nw.value,p);toast("PIN changed");render();}},"Change PIN"),
      h("button",{class:"full danger",style:"margin-top:10px",onclick:async()=>{
        if(!(await checkPin(cur.value))){toast("Wrong PIN");return;}
        try{localStorage.removeItem(PINKEY);}catch(e){}
        toast("PIN removed");render();}},"Remove PIN")));
}

/* ---------- shell ---------- */
function render(){
  const app=document.getElementById("app");
  if(locked){document.querySelectorAll("nav,.toast,.ov").forEach(n=>n.remove());app.replaceChildren(viewLock());return;}
  const views={home:viewHome,add:viewAdd,plan:viewPlan,more:viewMore};
  app.replaceChildren(...[
    tab==="home"?h("h1",null,"Money Tracker"):null,
    (tab==="home"&&!gToken&&!gMsg)?h("div",{class:"banner"},"Sync is off here. Entries are kept on this device only, so export a backup."):null,
    (tab==="home"&&gMsg)?h("small",{style:"display:block;color:"+(gErr?"var(--exp)":"var(--mute)")+";margin-bottom:8px"},gMsg):null,
    views[tab]()
  ].filter(Boolean));
  document.querySelectorAll("nav").forEach(n=>n.remove());
  const tabs=[["home","🏠","Home"],["add","➕","Add"],["plan","📊","Plan"],["more","⚙️","More"]];
  document.body.append(h("nav",null,tabs.map(([k,ic,l])=>h("button",{class:tab===k?"on":"",onclick:()=>{
    if(tab==="add"&&k!=="add"&&edit){edit=null;resetDraft();}
    if(k==="more")more=null;
    budDraft=null;tab=k;render();window.scrollTo(0,0);}},h("span",{class:"ic"},ic),l))));
}
loadLocal();
ensureWallets();
lastIds=idsNow();
if(navigator.serviceWorker){navigator.serviceWorker.register("sw.js").catch(()=>{});}
locked=!!getPin();
document.addEventListener("visibilitychange",()=>{if(document.hidden){hiddenAt=Date.now();}else if(getPin()&&hiddenAt&&Date.now()-hiddenAt>60000&&!locked){lockNow();}});
document.documentElement.lang=lang==="zh"?"zh-CN":lang;
render();
initScan();
</script>
